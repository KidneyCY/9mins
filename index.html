<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>9 分鐘耐力跑計圈（鏡頭）</title>
<style>
:root{--bg:#eef2ee;--sf:#fff;--ink:#14231c;--mut:#5b6b62;--ac:#1f6b4a;--acink:#fff;--ln:#d3dcd5;--warn:#c99700;--bad:#c8372d;--hit:#cfeedd;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a15;--sf:#17261e;--ink:#e8f0ea;--mut:#93a89b;--ac:#4fbf8b;--acink:#0b1710;--ln:#294036;--warn:#e8c531;--bad:#ff7066;--hit:#24533e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a15;--sf:#17261e;--ink:#e8f0ea;--mut:#93a89b;--ac:#4fbf8b;--acink:#0b1710;--ln:#294036;--warn:#e8c531;--bad:#ff7066;--hit:#24533e;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
.wrap{max-width:980px;margin:0 auto;padding:0 14px 40px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:0;border-radius:10px;padding:12px 20px;font-weight:700;background:var(--ac);color:var(--acink)}
.btn.ghost{background:transparent;border:2px solid var(--ln);color:var(--ink)}
.btn.bad{background:var(--bad);color:#fff}
.btn:focus-visible,.tile:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
h1{font-size:26px;margin:26px 0 4px}
p.sub{color:var(--mut);margin:0 0 18px}
label{display:block;font-weight:700;margin:16px 0 6px}
textarea,input{width:100%;font:inherit;color:var(--ink);background:var(--sf);border:2px solid var(--ln);border-radius:10px;padding:10px 12px}
textarea{min-height:200px;resize:vertical}
.row{display:flex;gap:12px}.row>div{flex:1}
.err{color:var(--bad);font-weight:700;min-height:24px;margin:8px 0}
/* running header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--sf);margin:0 -14px 14px;padding:10px 14px 0;border-bottom:2px solid var(--ln)}
.bar .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.clock{font-size:clamp(48px,14vw,84px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.clock.warn{color:var(--warn)}.clock.bad{color:var(--bad)}
.meta{color:var(--mut);font-size:14px}
.prog{height:8px;background:var(--ln);margin:10px -14px 0}
.prog i{display:block;height:100%;width:0;background:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;user-select:none;-webkit-user-select:none;touch-action:manipulation;background:var(--sf);border:2px solid var(--ln);border-radius:14px;padding:12px 12px 10px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.tile .nm{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:34px}
.tile .ct{font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.tile .lt{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.tile .mn{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:8px;border:2px solid var(--ln);background:transparent;font-size:20px;line-height:1;padding:0}
.tile.hit{animation:hit .35s}
@keyframes hit{0%{background:var(--hit);transform:scale(.97)}100%{background:var(--sf);transform:none}}
.off .tile{opacity:.5;pointer-events:none}
@media (prefers-reduced-motion:reduce){.tile.hit{animation:none;background:var(--hit)}}
/* results */
.tbl{overflow-x:auto;background:var(--sf);border:2px solid var(--ln);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--ln);font-variant-numeric:tabular-nums}
th{color:var(--mut);font-size:14px}
td input{width:84px;padding:6px 8px}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
#csvbox{display:none;min-height:120px;margin-top:8px}
.feed{color:var(--mut);font-size:14px;min-height:22px;margin:0 0 10px;font-variant-numeric:tabular-nums}
.feed b{color:var(--ink)}
.rows{display:grid;gap:8px;margin:12px 0}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--sf);border:2px solid var(--ln);border-radius:10px;padding:10px 14px;text-align:left;width:100%}
.rw.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.rw .tg{color:var(--mut);font-variant-numeric:tabular-nums;font-size:14px}
.rw .ok{color:var(--ac);font-weight:700}
.note{background:var(--sf);border:2px solid var(--ln);border-radius:10px;padding:10px 14px;color:var(--mut);font-size:14px}
.vid{position:relative;background:#000;border-radius:12px;overflow:hidden}.vid video,.vid canvas{display:block;width:100%}.vid canvas{position:absolute;inset:0;height:100%}.vid.sm{max-width:360px;margin-bottom:10px}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 12px;margin:6px 0}select{width:100%;font:inherit;color:var(--ink);background:var(--sf);border:2px solid var(--ln);border-radius:10px;padding:10px 12px}input[type=range]{padding:0;border:0;background:transparent}</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function makeDict(raw){const D={};for(const id in raw)D[raw[id].map(v=>v===0?1:0).join('')]=+id;return D}
function rot4(g){const o=[];for(let r=0;r<4;r++)for(let c=0;c<4;c++)o.push(g[(3-c)*4+r]);return o}
function detectMarkers(rgba,w,h,DICT){
 const n=w*h,g=new Uint8Array(n);
 for(let i=0,j=0;i<n;i++,j+=4)g[i]=(rgba[j]*77+rgba[j+1]*150+rgba[j+2]*29)>>8;
 const W1=w+1,ii=new Uint32Array(W1*(h+1));
 for(let y=0;y<h;y++){let row=0;for(let x=0;x<w;x++){row+=g[y*w+x];ii[(y+1)*W1+x+1]=ii[y*W1+x+1]+row}}
 const r=Math.max(10,Math.round(Math.max(w,h)/20)),bin=new Uint8Array(n);
 for(let y=0;y<h;y++){const y0=Math.max(0,y-r),y1=Math.min(h,y+r+1);
  for(let x=0;x<w;x++){const x0=Math.max(0,x-r),x1=Math.min(w,x+r+1);
   const s=ii[y1*W1+x1]-ii[y0*W1+x1]-ii[y1*W1+x0]+ii[y0*W1+x0],a=(x1-x0)*(y1-y0);
   if(g[y*w+x]*a<s-8*a)bin[y*w+x]=1}}
 const vis=new Uint8Array(n),q=new Int32Array(n),out=[],minS=Math.max(12,(w/80)|0);
 for(let s0=0;s0<n;s0++){
  if(!bin[s0]||vis[s0])continue;
  let head=0,tail=0,minx=w,maxx=0,miny=h,maxy=0,sx=0,sy=0;q[tail++]=s0;vis[s0]=1;
  while(head<tail){const p=q[head++],x=p%w,y=(p/w)|0;sx+=x;sy+=y;
   if(x<minx)minx=x;if(x>maxx)maxx=x;if(y<miny)miny=y;if(y>maxy)maxy=y;
   if(x>0&&bin[p-1]&&!vis[p-1]){vis[p-1]=1;q[tail++]=p-1}
   if(x<w-1&&bin[p+1]&&!vis[p+1]){vis[p+1]=1;q[tail++]=p+1}
   if(y>0&&bin[p-w]&&!vis[p-w]){vis[p-w]=1;q[tail++]=p-w}
   if(y<h-1&&bin[p+w]&&!vis[p+w]){vis[p+w]=1;q[tail++]=p+w}}
  const bw=maxx-minx+1,bh=maxy-miny+1;
  if(bw<minS||bh<minS||bw>w*.8||bh>h*.8||minx===0||miny===0||maxx===w-1||maxy===h-1||tail/(bw*bh)<.2)continue;
  const cx=sx/tail,cy=sy/tail;let b1=-1,d1=-1;
  for(let k=0;k<tail;k++){const p=q[k],dx=p%w-cx,dy=((p/w)|0)-cy,d=dx*dx+dy*dy;if(d>d1){d1=d;b1=p}}
  const x1=b1%w,y1=(b1/w)|0;let b2=-1,d2=-1;
  for(let k=0;k<tail;k++){const p=q[k],dx=p%w-x1,dy=((p/w)|0)-y1,d=dx*dx+dy*dy;if(d>d2){d2=d;b2=p}}
  const x2=b2%w,y2=(b2/w)|0,ux=x2-x1,uy=y2-y1;let bA=b1,bB=b1,mx=0,mn=0;
  for(let k=0;k<tail;k++){const p=q[k],c=(p%w-x1)*uy-(((p/w)|0)-y1)*ux;if(c>mx){mx=c;bA=p}if(c<mn){mn=c;bB=p}}
  if(bA===b1||bB===b1)continue;
  let P=[[x1,y1],[bA%w,(bA/w)|0],[x2,y2],[bB%w,(bB/w)|0]];
  let ar=0;for(let i=0;i<4;i++){const a=P[i],b=P[(i+1)%4];ar+=a[0]*b[1]-b[0]*a[1]}
  if(ar<0){P=[P[0],P[3],P[2],P[1]];ar=-ar}ar/=2;
  const ratio=tail/ar;if(ratio<.4||ratio>1.1)continue;
  const sd=[0,1,2,3].map(i=>Math.hypot(P[i][0]-P[(i+1)%4][0],P[i][1]-P[(i+1)%4][1]));
  if(Math.min(...sd)/Math.max(...sd)<.45)continue;
  const[x0_,y0_]=P[0],[x1_,y1_]=P[1],[x2_,y2_]=P[2],[x3_,y3_]=P[3];
  const dx1=x1_-x2_,dx2=x3_-x2_,dx3=x0_-x1_+x2_-x3_,dy1=y1_-y2_,dy2=y3_-y2_,dy3=y0_-y1_+y2_-y3_,den=dx1*dy2-dx2*dy1;
  if(!den)continue;
  const gg=(dx3*dy2-dx2*dy3)/den,hh=(dx1*dy3-dx3*dy1)/den,a=x1_-x0_+gg*x1_,b=x3_-x0_+hh*x3_,d=y1_-y0_+gg*y1_,e=y3_-y0_+hh*y3_;
  const smp=(u,v)=>{const z=gg*u+hh*v+1,X=Math.round((a*u+b*v+x0_)/z),Y=Math.round((d*u+e*v+y0_)/z);return X<0||Y<0||X>=w||Y>=h?128:g[Y*w+X]};
  const cell=[];
  for(let rr=0;rr<6;rr++)for(let c=0;c<6;c++){const u=(c+.5)/6,v=(rr+.5)/6,o=.045;
   cell.push((smp(u,v)*2+smp(u-o,v)+smp(u+o,v)+smp(u,v-o)+smp(u,v+o))/6)}
  const m=cell.reduce((s,v)=>s+v,0)/36;let ds=0,dn=0,ls=0,ln=0;
  for(const v of cell){if(v<m){ds+=v;dn++}else{ls+=v;ln++}}
  if(!dn||!ln)continue;const thr=(ds/dn+ls/ln)/2;if(ls/ln-ds/dn<40)continue;
  const dark=cell.map(v=>v<thr?1:0);let bd=0;
  for(let rr=0;rr<6;rr++)for(let c=0;c<6;c++)if((rr===0||rr===5||c===0||c===5)&&dark[rr*6+c])bd++;
  if(bd<18){(out.rj=out.rj||[]).push(P);continue}
  let gr=[];for(let rr=1;rr<5;rr++)for(let c=1;c<5;c++)gr.push(dark[rr*6+c]);
  let ok=0;for(let k=0;k<4;k++){const id=DICT[gr.join('')];if(id!==undefined){out.push({id,corners:P,cx:(P[0][0]+P[1][0]+P[2][0]+P[3][0])/4,cy:(P[0][1]+P[1][1]+P[2][1]+P[3][1])/4});ok=1;break}gr=rot4(gr)}if(!ok)(out.rj=out.rj||[]).push(P)
 }
 return out}


const DICT=makeDict({"1": [0, 0, 0, 0, 255, 255, 255, 255, 255, 0, 0, 255, 255, 0, 255, 0], "2": [0, 0, 255, 255, 0, 0, 255, 255, 0, 0, 255, 0, 255, 255, 0, 255], "3": [255, 0, 0, 255, 255, 0, 0, 255, 0, 255, 0, 0, 0, 255, 255, 0], "4": [0, 255, 0, 255, 0, 255, 0, 0, 255, 0, 0, 255, 255, 255, 255, 0], "5": [0, 255, 255, 255, 255, 0, 0, 255, 255, 255, 0, 0, 255, 255, 0, 255], "6": [255, 0, 0, 255, 255, 255, 255, 0, 0, 0, 255, 0, 255, 255, 255, 0], "7": [255, 255, 0, 0, 0, 255, 0, 0, 255, 255, 255, 255, 0, 0, 255, 0], "8": [255, 255, 255, 255, 255, 255, 255, 0, 255, 255, 0, 255, 255, 0, 255, 0], "9": [255, 255, 0, 0, 255, 255, 255, 255, 0, 255, 0, 255, 0, 255, 255, 0], "10": [255, 255, 255, 255, 255, 0, 0, 255, 255, 0, 0, 255, 0, 0, 0, 255], "11": [0, 0, 0, 255, 0, 0, 0, 255, 255, 0, 255, 0, 0, 255, 255, 255], "12": [0, 0, 0, 0, 255, 255, 255, 0, 255, 0, 255, 255, 0, 255, 255, 255], "13": [0, 0, 255, 0, 255, 0, 255, 0, 0, 0, 0, 0, 255, 255, 255, 255], "14": [0, 0, 255, 0, 0, 255, 0, 0, 255, 0, 255, 255, 0, 0, 0, 255], "15": [0, 0, 255, 0, 0, 255, 255, 0, 0, 0, 255, 255, 255, 255, 255, 0]});
let S={phase:'setup',names:[],laps:[],extra:[],start:0,end:0,dur:540000,lapLen:120,text:'',minLap:15,log:[],cam:{axis:'v',pos:.5,dir:0,res:1280,mode:'zone',bw:.35,ex:0,facing:'environment'}};
let timer=null,actx=null,wake=null,endArm=null,stream=null,looping=false,busy=false,lastRun=0,tracks={},lastDets=[],lastRej=[],lastDim=[16,9],fpsN=0,fpsT=0,fps=0;
const off=document.createElement('canvas'),octx=off.getContext('2d',{willReadFrequently:true});
function save(){try{localStorage.setItem('run9-cam2',JSON.stringify(S))}catch(e){}}
function load(){try{const j=JSON.parse(localStorage.getItem('run9-cam2')||'null');if(j&&j.names)S=Object.assign(S,j,{cam:Object.assign(S.cam,j.cam||{})})}catch(e){}}
const fmt=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fmt1=ms=>{const t=Math.floor(ms/100)/10;return Math.floor(t/60)+':'+(t%60).toFixed(1).padStart(4,'0')};

function beep(n){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
 for(let i=0;i<n;i++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.2;o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+i*.4);o.stop(actx.currentTime+i*.4+.2)}}catch(e){}}
async function lockOn(){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}
function lockOff(){try{wake&&wake.release();wake=null}catch(e){}}


function renderSetup(){
 $('#app').innerHTML=`<h1>9 分鐘耐力跑計圈（鏡頭版）</h1><p class="sub">第 1 位學生配對佩章 1 號，第 2 位配對 2 號，如此類推（最多 15 位）。</p>
 <label for="names">學生名單（每行一位，或用逗號分隔）</label>
 <textarea id="names" placeholder="陳大文&#10;李小明&#10;張美玲">${esc(S.text||'')}</textarea>
 <div class="row"><div><label for="len">每圈長度（米）</label><input id="len" type="number" inputmode="numeric" min="1" value="${S.lapLen}"></div>
 <div><label for="min">時間（分鐘）</label><input id="min" type="number" inputmode="decimal" min="1" step="0.5" value="${S.dur/60000}"></div>
 <div><label for="ml">最短一圈（秒）</label><input id="ml" type="number" inputmode="numeric" min="1" value="${S.minLap}"></div></div>
 <div class="err" id="err"></div><button class="btn" id="go" style="font-size:20px;padding:16px 28px">下一步：設定鏡頭</button>`;
 $('#go').onclick=()=>{
  const names=$('#names').value.split(/[\n,，、]+/).map(s=>s.trim()).filter(Boolean);
  const len=parseFloat($('#len').value),mins=parseFloat($('#min').value),ml=parseFloat($('#ml').value);
  if(!names.length){$('#err').textContent='請先輸入最少一位學生。';return}
  if(names.length>15){$('#err').textContent='佩章只有 1 至 15 號，請減到 15 位以內。';return}
  if(!(len>0)||!(mins>0)||!(ml>0)){$('#err').textContent='每圈長度、時間同最短一圈要大過 0。';return}
  S=Object.assign(S,{phase:'cam',names,laps:names.map(()=>[]),extra:names.map(()=>0),start:0,end:0,dur:Math.round(mins*60000),lapLen:len,text:$('#names').value,minLap:ml,log:[]});
  save();renderCam()};
}
const vidHTML=cls=>`<div class="vid ${cls}"><video id="v" playsinline muted autoplay></video><canvas id="ov"></canvas></div>`;
function renderCam(){
 const c=S.cam,vv=c.axis==='v';
 $('#app').innerHTML=`<h1>設定鏡頭</h1><p class="sub">將鏡頭對住過線位置，調整綠線。「區域」模式：綠色範圍內見到佩章就計一圈；「過線」模式：要見到佩章橫過綠線。呢頁係測試模式，唔會計圈。</p>${vidHTML('')}
 <div class="ctl"><div><label for="ax">綠線方向</label><select id="ax"><option value="v"${vv?' selected':''}>垂直線（學生左右橫過）</option><option value="h"${vv?'':' selected'}>水平線（學生上下過）</option></select></div>
 <div><label for="dr">計圈方向</label><select id="dr"><option value="0"${c.dir===0?' selected':''}>任何方向</option><option value="1"${c.dir===1?' selected':''}>${vv?'由左至右':'由上至下'}</option><option value="-1"${c.dir===-1?' selected':''}>${vv?'由右至左':'由下至上'}</option></select></div>
 <div><label for="md">記圈方式</label><select id="md"><option value="zone"${c.mode==='zone'?' selected':''}>區域（建議）：範圍內見到就計</option><option value="line"${c.mode==='line'?' selected':''}>過線：要見到橫過綠線</option></select></div>
 <div><label for="bw">區域闊度</label><select id="bw">${[20,35,60,100].map(p=>`<option value="${p}"${Math.round(c.bw*100)===p?' selected':''}>${p===100?'全畫面':p+'%'}</option>`).join('')}</select></div>
 <div><label for="ps">綠線／區域位置</label><input id="ps" type="range" min="5" max="95" value="${Math.round(c.pos*100)}"></div>
 <div><label for="ex">快門速度（減少郁動模糊）</label><select id="ex"><option value="0">自動</option><option value="40">1/250 秒</option><option value="20">1/500 秒</option><option value="10">1/1000 秒</option><option value="5">1/2000 秒</option></select><div class="meta" id="exs"></div></div>
 <div><label for="rs">偵測解析度</label><select id="rs"><option value="960"${c.res===960?' selected':''}>960（快，近距離）</option><option value="1280"${c.res===1280?' selected':''}>1280（預設）</option><option value="1920"${c.res===1920?' selected':''}>1920（遠距離，較慢）</option></select></div></div>
 <div class="note" id="seen">開啟鏡頭中…</div><div class="feed" id="feed" style="margin-top:8px"></div>
 <div class="acts"><button class="btn" id="go2" style="font-size:20px;padding:16px 28px">開始計時</button><button class="btn ghost" id="flip">切換前後鏡頭</button><button class="btn ghost" id="bk">返回修改名單</button></div>`;
 $('#ax').onchange=e=>{c.axis=e.target.value;save();renderCam()};
 $('#dr').onchange=e=>{c.dir=+e.target.value;save()};
 $('#ps').oninput=e=>{c.pos=e.target.value/100;save();drawOverlay()};
 $('#rs').onchange=e=>{c.res=+e.target.value;save()};
 $('#md').onchange=e=>{c.mode=e.target.value;save();drawOverlay()};$('#bw').onchange=e=>{c.bw=+e.target.value/100;save();drawOverlay()};
 $('#ex').value=String(c.ex||0);$('#ex').onchange=e=>applyExposure(+e.target.value);
 $('#flip').onclick=()=>{c.facing=c.facing==='environment'?'user':'environment';save();startCam()};
 $('#bk').onclick=()=>{stopCam();S.phase='setup';save();renderSetup()};
 $('#go2').onclick=()=>{S.phase='run';S.start=Date.now();S.log=[];tracks={};beep(1);lockOn();save();renderRun()};
 startCam();
}
async function startCam(){
 try{stopCam();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:S.cam.facing,width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:60}},audio:false});
  attachVideo();looping=true;requestAnimationFrame(frame);applyExposure(S.cam.ex||0)}
 catch(e){const n=$('#seen');if(n)n.textContent='未能開啟鏡頭（'+(e.name||'錯誤')+'）。請允許鏡頭權限；如果喺預覽視窗內開唔到，請用瀏覽器直接開啟連結。仍然可以用格仔手動記圈。'}
}
async function applyExposure(v){
 const st=$('#exs'),tr=stream&&stream.getVideoTracks()[0];S.cam.ex=v;save();if(!tr)return;
 let caps={};try{caps=tr.getCapabilities()||{}}catch(e){}
 if(!caps.exposureTime){if(st)st.textContent='呢部裝置或者瀏覽器唔支援手動快門（iPad Safari 通常唔支援，Android 版 Chrome 多數支援）。';return}
 try{if(!v){await tr.applyConstraints({advanced:[{exposureMode:'continuous'}]});if(st)st.textContent='自動'}
  else{const t=Math.min(caps.exposureTime.max,Math.max(caps.exposureTime.min,v)),adv={exposureMode:'manual',exposureTime:t};if(caps.iso)adv.iso=Math.min(caps.iso.max,800);await tr.applyConstraints({advanced:[adv]});if(st)st.textContent='已套用。如果畫面太暗，請加強光線。'}}
 catch(e){if(st)st.textContent='套用失敗（'+(e.name||'錯誤')+'）'}}
function attachVideo(){const v=$('#v');if(v&&stream){v.srcObject=stream;v.play().catch(()=>{})}}
function stopCam(){looping=false;try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}stream=null}
function frame(ts){
 if(!looping)return;requestAnimationFrame(frame);
 const v=$('#v');if(!v||!v.videoWidth||busy||ts-lastRun<60)return;lastRun=ts;busy=true;
 try{const c=S.cam,vw=v.videoWidth,vh=v.videoHeight,k=c.res/vw,pw=Math.round(vw*k),ph=Math.round(vh*k);
  let nx0=0,nx1=1,ny0=0,ny1=1;
  if(c.mode==='zone'&&c.bw<1){const a=Math.max(0,c.pos-c.bw/2),b=Math.min(1,c.pos+c.bw/2);if(c.axis==='v'){nx0=a;nx1=b}else{ny0=a;ny1=b}}
  const sx=Math.round(nx0*vw),sy=Math.round(ny0*vh),sw=Math.max(16,Math.round((nx1-nx0)*vw)),sh=Math.max(16,Math.round((ny1-ny0)*vh)),cw=Math.round(sw*k),ch=Math.round(sh*k);
  if(off.width!==cw||off.height!==ch){off.width=cw;off.height=ch}
  octx.drawImage(v,sx,sy,sw,sh,0,0,cw,ch);
  const ds=detectMarkers(octx.getImageData(0,0,cw,ch).data,cw,ch,DICT),ox=sx*k,oy=sy*k;
  for(const d of ds){d.corners=d.corners.map(p=>[p[0]+ox,p[1]+oy]);d.cx+=ox;d.cy+=oy}
  lastDets=ds;lastRej=(ds.rj||[]).map(P=>P.map(p=>[p[0]+ox,p[1]+oy]));lastDim=[pw,ph];
  fpsN++;if(ts-fpsT>1000){fps=fpsN*1000/(ts-fpsT);fpsN=0;fpsT=ts}
  onDets(lastDets,pw,ph);drawOverlay()}catch(e){}
 busy=false}
function onDets(ds,pw,ph){
 const now=Date.now(),c=S.cam;
 for(const d of ds){const s=c.axis==='v'?d.cx/pw:d.cy/ph,tr=tracks[d.id];
  if(c.mode==='zone'){if(!tr||now-tr.t>1500)cross(d.id,now)}
  else if(tr&&now-tr.t<2000&&(tr.s-c.pos)*(s-c.pos)<0){const dir=s>tr.s?1:-1;if(c.dir===0||c.dir===dir)cross(d.id,now)}
  tracks[d.id]={s,t:now}}
 const n=$('#seen');if(n&&S.phase==='cam')n.textContent=(ds.length?'偵測到：'+ds.map(d=>d.id+(S.names[d.id-1]?' '+S.names[d.id-1]:'（未配對）')).join('、'):'暫時未見到佩章')+(lastRej.length?' ｜ 認唔到嘅疑似佩章 '+lastRej.length+'（橙框，可能太糊）':'')+' ｜ '+fps.toFixed(0)+' 次/秒';
 const m=$('#meta');if(m&&S.phase==='run')m.textContent='見到 '+ds.length+' 個佩章 ｜ '+fps.toFixed(0)+' 次/秒 ｜ 總圈數 '+S.laps.reduce((a,l)=>a+l.length,0)+' ｜ 已跑 '+fmt(now-S.start)}
function cross(id,now){const i=id-1;if(i<0||i>=S.names.length)return;
 if(S.phase==='cam'){feed('（測試）'+esc(S.names[i])+' 過線');return}
 if(S.phase!=='run')return;const L=S.laps[i],prev=L.length?L[L.length-1]:0;
 if(now-S.start-prev<S.minLap*1000)return;lap(i,true)}
function drawOverlay(){
 const cv=$('#ov');if(!cv)return;const[pw,ph]=lastDim;if(cv.width!==pw||cv.height!==ph){cv.width=pw;cv.height=ph}
 const x=cv.getContext('2d'),c=S.cam;x.clearRect(0,0,pw,ph);
 if(c.mode==='zone'&&c.bw<1){x.fillStyle='rgba(46,224,111,.15)';const a=Math.max(0,c.pos-c.bw/2),b=Math.min(1,c.pos+c.bw/2);if(c.axis==='v')x.fillRect(a*pw,0,(b-a)*pw,ph);else x.fillRect(0,a*ph,pw,(b-a)*ph)}
 x.strokeStyle='#2ee06f';x.lineWidth=Math.max(2,pw/320);x.beginPath();
 if(c.axis==='v'){x.moveTo(c.pos*pw,0);x.lineTo(c.pos*pw,ph)}else{x.moveTo(0,c.pos*ph);x.lineTo(pw,c.pos*ph)}x.stroke();
 x.font='bold '+Math.round(pw/32)+'px sans-serif';
 for(const P of lastRej){x.strokeStyle='#ff8a00';x.beginPath();P.forEach((p,k)=>k?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.stroke()}
 for(const d of lastDets){x.strokeStyle='#ffd400';x.beginPath();d.corners.forEach((p,k)=>k?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.stroke();
  x.fillStyle='#ffd400';x.fillText(String(d.id),d.cx-6,d.cy+6)}}
function renderRun(){
 $('#app').innerHTML=`<div class="bar"><div class="top"><div><div class="clock" id="clk">${fmt(S.dur)}</div><div class="meta" id="meta"></div></div>
 <button class="btn ghost" id="end">結束測驗</button></div><div class="prog"><i id="pg"></i></div></div>
 <div class="feed" id="feed"></div>${vidHTML('sm')}
 <div class="grid" id="grid">${S.names.map((n,i)=>`<div class="tile" id="t${i}" data-i="${i}" role="button" tabindex="0" aria-label="${esc(n)} 加一圈">
 <button class="mn" data-u="${i}" aria-label="${esc(n)} 減一圈">−</button><div class="nm">${i+1} ${esc(n)}</div><div class="ct" id="c${i}">${S.laps[i].length}</div><div class="lt" id="l${i}"></div></div>`).join('')}</div>`;
 S.names.forEach((_,i)=>paintTile(i));attachVideo();feed('等待佩章過線…');
 $('#grid').onclick=e=>{const u=e.target.closest('[data-u]');if(u){e.stopPropagation();undo(+u.dataset.u);return}const t=e.target.closest('.tile');if(t)lap(+t.dataset.i)};
 $('#end').onclick=armEnd;clearInterval(timer);timer=setInterval(tick,200);tick();
 if(!stream)startCam();else if(!looping){looping=true;requestAnimationFrame(frame)}
}
function feed(t){S.log.unshift(t);S.log=S.log.slice(0,4);const f=$('#feed');if(f)f.innerHTML=S.log.map((x,k)=>k?x:'<b>'+x+'</b>').join(' ｜ ')}
function paintTile(i){const L=S.laps[i];$('#c'+i).textContent=L.length;$('#l'+i).textContent=L.length?'最近 '+fmt(L[L.length-1]):'未過線'}
function lap(i,auto){if(S.phase!=='run')return;const el=Date.now()-S.start;if(el>=S.dur)return;
 S.laps[i].push(el);paintTile(i);feed(esc(S.names[i])+' 第 '+S.laps[i].length+' 圈'+(auto?'':'（手動）'));
 const t=$('#t'+i);t.classList.remove('hit');void t.offsetWidth;t.classList.add('hit');try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}save()}
function undo(i){if(S.phase!=='run'||!S.laps[i].length)return;S.laps[i].pop();paintTile(i);save()}
function tick(){if(S.phase!=='run')return;const el=Date.now()-S.start;if(el>=S.dur){finish(true);return}
 const rem=S.dur-el,c=$('#clk');c.textContent=fmt(Math.ceil(rem/1000)*1000);c.className='clock'+(rem<=10000?' bad':rem<=60000?' warn':'');$('#pg').style.width=(el/S.dur*100)+'%'}
function armEnd(){const b=$('#end');if(endArm){clearTimeout(endArm);endArm=null;finish(false);return}
 b.textContent='確定結束？';b.className='btn bad';endArm=setTimeout(()=>{endArm=null;const e=$('#end');if(e){e.textContent='結束測驗';e.className='btn ghost'}},3500)}
function finish(auto){if(S.phase!=='run')return;clearInterval(timer);clearTimeout(endArm);endArm=null;stopCam();
 S.phase='done';S.end=auto?S.start+S.dur:Date.now();S.endedAuto=auto;if(auto)beep(3);lockOff();save();renderDone()}
function total(i){return S.laps[i].length*S.lapLen+(+S.extra[i]||0)}
function csv(){const rows=[['姓名','圈數','每圈長度(米)','額外距離(米)','總距離(米)','每圈過線時間']];
 S.names.forEach((n,i)=>rows.push([n,S.laps[i].length,S.lapLen,+S.extra[i]||0,total(i),S.laps[i].map(fmt1).join(' ')]));
 return rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n')}
function renderDone(){
 const el=Math.min(S.end-S.start,S.dur),order=S.names.map((_,i)=>i).sort((a,b)=>S.laps[b].length-S.laps[a].length||a-b);
 $('#app').innerHTML=`<h1>測驗完成</h1><p class="sub">${S.endedAuto?'時間到。':'已手動結束。'}實際計時 ${fmt1(el)}，共 ${S.names.length} 位學生，每圈 ${S.lapLen} 米。最後未完成一圈嘅距離可喺「額外距離」填寫。</p>
 <div class="tbl"><table><thead><tr><th>名次</th><th>姓名</th><th>圈數</th><th>額外距離（米）</th><th>總距離（米）</th></tr></thead><tbody>
 ${order.map((i,r)=>`<tr><td>${r+1}</td><td>${esc(S.names[i])}</td><td>${S.laps[i].length}</td><td><input type="number" inputmode="numeric" min="0" value="${+S.extra[i]||''}" data-x="${i}" aria-label="${esc(S.names[i])} 額外距離"></td><td id="d${i}">${total(i)}</td></tr>`).join('')}
 </tbody></table></div>
 <div class="acts"><button class="btn" id="cp">複製成 CSV</button><button class="btn ghost" id="again">重新開始</button></div>
 <textarea id="csvbox" readonly></textarea>`;
 $('#app').oninput=e=>{const x=e.target.dataset&&e.target.dataset.x;if(x!==undefined){S.extra[+x]=Math.max(0,parseFloat(e.target.value)||0);$('#d'+x).textContent=total(+x);save()}};
 $('#cp').onclick=async()=>{const t=csv();try{await navigator.clipboard.writeText(t);$('#cp').textContent='已複製'}catch(e){const b=$('#csvbox');b.value=t;b.style.display='block';b.select();$('#cp').textContent='請手動複製下面內容'}};
 $('#again').onclick=()=>{S.phase='setup';S.names=[];S.laps=[];S.extra=[];save();renderSetup()};
}

load();
if(S.phase==='cam')renderCam();
else if(S.phase==='run'){if(Date.now()-S.start>=S.dur)finish(true);else{lockOn();renderRun()}}
else if(S.phase==='done'&&S.names.length)renderDone();
else{S.phase='setup';renderSetup()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.phase==='run')lockOn()});

</script>
</body>
</html>
